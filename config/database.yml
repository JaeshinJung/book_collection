default: &default
  adapter: postgresql
  encoding: unicode
  host: localhost
  username: postgres
  password: password
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: test_app_development

test:
  <% if ENV['DATABASE_URL'] %>
    url: <%= ENV['DATABASE_URL'] %>
    adapter: postgresql
  <% else %>
    <<: *default
    database: test_app_test
  <% end %>

production:
  primary: &primary_production
    <<: *default
    database: test_app_production
    username: test_app
    password: <%= ENV["TEST_APP_DATABASE_PASSWORD"] %>
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    database: test_app_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: test_app_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: test_app_production_cable
    migrations_paths: db/cable_migrate
